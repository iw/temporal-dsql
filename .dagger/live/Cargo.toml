[package]
name = "live"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false
description = "Runs the DSQL plugin's live tests on throwaway AWS resources"

[dependencies]
aws-config = "1.13.0"
aws-credential-types = "1"
aws-sdk-dsql = "1.78.0"
aws-sdk-dynamodb = "1.135.0"
aws-sdk-sts = "1.123.0"
dagger-sdk = { package = "tokeira-dagger-sdk", version = "=0.3.1" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
