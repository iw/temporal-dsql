ity</text><text x="241" y="392" text-anchor="middle" font-size="11.5" style="fill: var(--cds-text-secondary)">learned p99</text><text x="241" y="408" text-anchor="middle" font-size="11.5" style="fill: var(--cds-text-secondary)">Proposal 3</text></g><g><rect x="318" y="352" width="124" height="72" rx="8" fill-opacity="0.12" stroke-width="2" style="fill: var(--cds-chart-categorical-1); stroke: var(--cds-chart-categorical-1)"></rect><text x="380" y="376" text-anchor="middle" font-weight="600" style="fill: var(--cds-text-primary)">Partitions</text><text x="380" y="392" text-anchor="middle" font-size="11.5" style="fill: var(--cds-text-secondary)">learned capacity</text><text x="380" y="408" text-anchor="middle" font-size="11.5" style="fill: var(--cds-text-secondary)">Proposal 6</text></g><g><rect x="457" y="352" width="124" height="72" rx="8" fill-opacity="0.12" stroke-width="2" style="fill: var(--cds-chart-categorical-1); stroke: var(--cds-chart-categorical-1)"></rect><text x="519" y="376" text-anchor="middle" font-weight="600" style="fill: var(--cds-text-primary)">Memory budget</text><text x="519" y="392" text-anchor="middle" font-size="11.5" style="fill: var(--cds-text-secondary)">cgroup share</text><text x="519" y="408" text-anchor="middle" font-size="11.5" style="fill: var(--cds-text-secondary)">Proposal 5</text></g><g><rect x="596" y="352" width="124" height="72" rx="8" fill-opacity="0.12" stroke-width="2" style="fill: var(--cds-chart-categorical-1); stroke: var(--cds-chart-categorical-1)"></rect><text x="658" y="376" text-anchor="middle" font-weight="600" style="fill: var(--cds-text-primary)">Fair share</text><text x="658" y="392" text-anchor="middle" font-size="11.5" style="fill: var(--cds-text-secondary)">host demand</text><text x="658" y="408" text-anchor="middle" font-size="11.5" style="fill: var(--cds-text-secondary)">Proposal 7</text></g><g><rect x="24" y="472" width="712" height="124" rx="8" fill="none" stroke-width="1.25" style="stroke: var(--cds-chart-gri