<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 414" role="img" aria-label="Coupled slow store: queued cuts hold capacity near 100 once it has probed back" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><style>svg { --cds-text-primary: #1f2328; --cds-text-secondary: #59636e; --cds-chart-axis: #818b98; --cds-chart-grid: #d1d9e0; --cds-chart-muted: #8c959f; --cds-chart-categorical-1: #0969da; --cds-chart-categorical-2: #bf8700; --cds-chart-categorical-3: #8250df; --cds-chart-categorical-4: #1a7f37; --cds-chart-reference: #59636e; --cds-chart-reference-tint: rgba(129, 139, 152, 0.14); } @media (prefers-color-scheme: dark) { svg { --cds-text-primary: #f0f6fc; --cds-text-secondary: #9198a1; --cds-chart-axis: #7d8590; --cds-chart-grid: #3d444d; --cds-chart-muted: #7d8590; --cds-chart-categorical-1: #4493f8; --cds-chart-categorical-2: #d29922; --cds-chart-categorical-3: #ab7df8; --cds-chart-categorical-4: #3fb950; --cds-chart-reference: #9198a1; --cds-chart-reference-tint: rgba(145, 152, 161, 0.18); } }</style><text x="24" y="28" font-size="15" font-weight="600" style="fill: var(--cds-text-primary)">Coupled slow store: queued cuts hold capacity near 100 once it has probed back</text><text x="24" y="48" font-size="11.5" style="fill: var(--cds-text-secondary)">Calls a second the capacity controller let through on the host with 21 shards, 5 s buckets. One run per config</text><g><line x1="72" x2="90" y1="72" y2="72" stroke-width="1.5" stroke-dasharray="5 4" style="stroke: var(--cds-chart-reference)"></line><text x="96" y="76" font-size="11.5" style="fill: var(--cds-text-secondary)">static rate</text><line x1="201" x2="219" y1="72" y2="72" stroke-width="1.5" stroke-dasharray="none" style="stroke: var(--cds-chart-muted)"></line><text x="225" y="76" font-size="11.5" style="fill: var(--cds-text-secondary)">capacity alone</text><line x1="351" x2="369" y1="72" y2="72" stroke-width="2" stroke-dasharray="none" style="stroke: var(--cds-chart-categorical-2)"></line><text x="375" y="76" font-size="11.5" style="fill: var(--cds-text-primary)">capacity and the task rate</text><line x1="72" x2="90" y1="90" y2="90" stroke-width="2.5" stroke-dasharray="none" style="stroke: var(--cds-chart-categorical-1)"></line><text x="96" y="94" font-size="11.5" style="fill: var(--cds-text-primary)">the two, with the coupled settings</text><line x1="362" x2="380" y1="90" y2="90" stroke-width="2" stroke-dasharray="none" style="stroke: var(--cds-chart-categorical-3)"></line><text x="386" y="94" font-size="11.5" style="fill: var(--cds-text-primary)">every controller, with the coupled settings</text></g><rect x="169.20" y="122" width="163.08" height="236" style="fill: var(--cds-chart-reference-tint)"></rect><text x="175.20" y="118" font-size="11.5" style="fill: var(--cds-text-secondary)">store replies 40 ms later</text><line x1="493.20" x2="493.20" y1="122" y2="358" stroke-dasharray="3 3" style="stroke: var(--cds-chart-reference)"></line><text x="499.20" y="118" font-size="11.5" style="fill: var(--cds-text-secondary)">load ends</text><line x1="72" x2="720" y1="358.00" y2="358.00" style="stroke: var(--cds-chart-grid)"></line><text x="64" y="362.00" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-secondary)">0</text><line x1="72" x2="720" y1="299.00" y2="299.00" style="stroke: var(--cds-chart-grid)"></line><text x="64" y="303.00" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-secondary)">80</text><line x1="72" x2="720" y1="240.00" y2="240.00" style="stroke: var(--cds-chart-grid)"></line><text x="64" y="244.00" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-secondary)">160</text><line x1="72" x2="720" y1="181.00" y2="181.00" style="stroke: var(--cds-chart-grid)"></line><text x="64" y="185.00" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-secondary)">240</text><line x1="72" x2="720" y1="122.00" y2="122.00" style="stroke: var(--cds-cha