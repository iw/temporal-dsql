<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 732" role="img" aria-label="Each phase ships behind a gate the previous phase must pass" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><style>svg { --cds-text-primary: #1f2328; --cds-text-secondary: #59636e; --cds-chart-axis: #818b98; --cds-chart-grid: #d1d9e0; --cds-chart-muted: #8c959f; --cds-chart-categorical-1: #0969da; --cds-chart-reference: #59636e; --cds-chart-reference-tint: rgba(129, 139, 152, 0.14); } @media (prefers-color-scheme: dark) { svg { --cds-text-primary: #f0f6fc; --cds-text-secondary: #9198a1; --cds-chart-axis: #7d8590; --cds-chart-grid: #3d444d; --cds-chart-muted: #7d8590; --cds-chart-categorical-1: #4493f8; --cds-chart-reference: #9198a1; --cds-chart-reference-tint: rgba(145, 152, 161, 0.18); } }</style><defs><marker id="road-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill: var(--cds-chart-axis)"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" style="fill: var(--cds-text-primary)">Each phase ships behind a gate the previous phase must pass</text><text x="24" y="52" font-size="11.5" style="fill: var(--cds-text-secondary)">Phases in order; durations not yet estimated</text><g><rect x="24" y="72" width="712" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></rect><text x="40" y="96" font-weight="600" style="fill: var(--cds-text-primary)">Phase 0 · Prototype without a fork</text><text x="40" y="116" font-size="11.5" style="fill: var(--cds-text-secondary)">Custom dynamic config Client plus a metrics tee (WithDynamicConfigClient, WithCustomMetricsHandler)</text><text x="40" y="132" font-size="11.5" style="fill: var(--cds-text-secondary)">Replay recorded signal traces through candidate control laws in a discrete-event simulator</text></g><g><g><path d="M56 148V170" fill="none" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></path><polygon points="56,170 66,180 56,190 46,180" fill="none" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></polygon><path d="M56 190V210" fill="none" stroke-width="1.25" marker-end="url(#road-arrow)" style="stroke: var(--cds-chart-axis)"></path></g><text x="80" y="184" font-size="11.5" style="fill: var(--cds-text-primary)">Gate: control laws stable on recorded production traces</text></g><g><rect x="24" y="212" width="712" height="76" rx="8" fill-opacity="0.12" stroke-width="2" style="fill: var(--cds-chart-categorical-1); stroke: var(--cds-chart-categorical-1)"></rect><text x="40" y="236" font-weight="600" style="fill: var(--cds-text-primary)">Phase 1 · Persistence capacity controller</text><text x="720" y="236" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-primary)">Prototyped: patch 0001 and simulation</text><text x="40" y="256" font-size="11.5" style="fill: var(--cds-text-secondary)">Land patch 0001 behind Capacity.Mode; run shadow, then enable on a canary cohort</text><text x="40" y="272" font-size="11.5" style="fill: var(--cds-text-secondary)">Expose WithPartitionScalerFactory; record scheduleLatency into the health aggregator</text></g><g><g><path d="M56 288V310" fill="none" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></path><polygon points="56,310 66,320 56,330 46,320" fill="none" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></polygon><path d="M56 330V350" fill="none" stroke-width="1.25" marker-end="url(#road-arrow)" style="stroke: var(--cds-chart-axis)"></path></g><text x="80" y="324" font-size="11.5" style="fill: var(--cds-text-primary)">Gate: shadow proposals reviewed; disabled mode proven unchanged</text></g><g><rect x="24" y="352" width="712" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></rect><text x="40" y="376" font-weight="600" style="fill: var(--cds-text-primary)">Phase 2 · Adaptive core</text><text x="40" y="396" font-size="11.5" style="fill: var(--cds-text-secondary)">common/adaptive (envelope, modes, freeze key) and common/signals (host snapshot plane)</text><text x="40" y="412" font-size="11.5" style="fill: var(--cds-text-secondary)">Worker-count controller in shadow on every history queue</text></g><g><g><path d="M56 428V450" fill="none" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></path><polygon points="56,450 66,460 56,470 46,460" fill="none" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></polygon><path d="M56 470V490" fill="none" stroke-width="1.25" marker-end="url(#road-arrow)" style="stroke: var(--cds-chart-axis)"></path></g><text x="80" y="464" font-size="11.5" style="fill: var(--cds-text-primary)">Gate: worker controller enabled on a canary cohort</text></g><g><rect x="24" y="492" width="712" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></rect><text x="40" y="516" font-weight="600" style="fill: var(--cds-text-primary)">Phase 3 · Coupling and memory</text><text x="40" y="536" font-size="11.5" style="fill: var(--cds-text-secondary)">Task scheduler rate derived from persistence capacity and measured calls per task</text><text x="40" y="552" font-size="11.5" style="fill: var(--cds-text-secondary)">Memory budget from cgroup limit; SetMaxSize on LRU caches; derived pending-task limit</text></g><g><g><path d="M56 568V590" fill="none" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></path><polygon points="56,590 66,600 56,610 46,600" fill="none" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></polygon><path d="M56 610V630" fill="none" stroke-width="1.25" marker-end="url(#road-arrow)" style="stroke: var(--cds-chart-axis)"></path></g><text x="80" y="604" font-size="11.5" style="fill: var(--cds-text-primary)">Gate: no ResourceExhausted churn when the database degrades</text></g><g><rect x="24" y="632" width="712" height="76" rx="8" fill="none" fill-opacity="1" stroke-width="1.25" style="stroke: var(--cds-chart-axis)"></rect><text x="40" y="656" font-weight="600" style="fill: var(--cds-text-primary)">Phase 4 · Matching and fair share</text><text x="40" y="676" font-size="11.5" style="fill: var(--cds-text-secondary)">Saturation-based partition scaler with learned per-partition capacity</text><text x="40" y="692" font-size="11.5" style="fill: var(--cds-text-secondary)">ShareProvider with demand-weighted quotas exchanged between frontends</text></g></svg>
