<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" role="img" aria-label="In the capacity drop, static goodput fell to 0; the controller held about 1,525 ops/s" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><style>svg { --cds-text-primary: #1f2328; --cds-text-secondary: #59636e; --cds-chart-axis: #818b98; --cds-chart-grid: #d1d9e0; --cds-chart-muted: #8c959f; --cds-chart-categorical-1: #0969da; --cds-chart-reference: #59636e; --cds-chart-reference-tint: rgba(129, 139, 152, 0.14); } @media (prefers-color-scheme: dark) { svg { --cds-text-primary: #f0f6fc; --cds-text-secondary: #9198a1; --cds-chart-axis: #7d8590; --cds-chart-grid: #3d444d; --cds-chart-muted: #7d8590; --cds-chart-categorical-1: #4493f8; --cds-chart-reference: #9198a1; --cds-chart-reference-tint: rgba(145, 152, 161, 0.18); } }</style><text x="24" y="28" font-size="15" font-weight="600" style="fill: var(--cds-text-primary)">In the capacity drop, static goodput fell to 0; the controller held ~1,525 ops/s</text><text x="24" y="48" font-size="11.5" style="fill: var(--cds-text-secondary)">Successful persistence ops/s, 20-second means. Trace A, 15 ms median DB latency.</text><g><g><line x1="72" x2="90" y1="72" y2="72" stroke-width="1.5" stroke-dasharray="5 4" style="stroke: var(--cds-chart-reference)"></line><text x="96" y="76" font-size="11.5" style="fill: var(--cds-text-secondary)">DB capacity</text></g><g><line x1="196" x2="214" y1="72" y2="72" stroke-width="1.5" stroke-dasharray="none" style="stroke: var(--cds-chart-muted)"></line><text x="220" y="76" font-size="11.5" style="fill: var(--cds-text-secondary)">Static (1.32 default)</text></g><g><line x1="360" x2="378" y1="72" y2="72" stroke-width="1.5" stroke-dasharray="2 3" style="stroke: var(--cds-chart-muted)"></line><text x="384" y="76" font-size="11.5" style="fill: var(--cds-text-secondary)">Legacy, oracle-tuned</text></g><g><line x1="520" x2="538" y1="72" y2="72" stroke-width="2.5" stroke-dasharray="none" style="stroke: var(--cds-chart-categorical-1)"></line><text x="544" y="76" font-size="11.5" style="fill: var(--cds-text-primary)">Proposed</text></g></g><g><rect x="291.66" y="104" width="192.2" height="236" style="fill: var(--cds-chart-reference-tint)"></rect><text x="299.66" y="100" font-size="11.5" style="fill: var(--cds-text-secondary)">DB capacity drops to 1,800 ops/s</text></g><g><line x1="104.95" x2="104.95" y1="104" y2="340" stroke-dasharray="3 3" style="stroke: var(--cds-chart-reference)"></line><text x="110.95" y="100" font-size="11.5" style="fill: var(--cds-text-secondary)">250k task burst</text></g><g><g><line x1="72" x2="720" y1="340" y2="340" style="stroke: var(--cds-chart-grid)"></line><text x="64" y="344" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-secondary)">0</text></g><g><line x1="72" x2="720" y1="294.8" y2="294.8" style="stroke: var(--cds-chart-grid)"></line><text x="64" y="298.8" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-secondary)">1,000</text></g><g><line x1="72" x2="720" y1="249.6" y2="249.6" style="stroke: var(--cds-chart-grid)"></line><text x="64" y="253.6" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-secondary)">2,000</text></g><g><line x1="72" x2="720" y1="204.4" y2="204.4" style="stroke: var(--cds-chart-grid)"></line><text x="64" y="208.4" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-secondary)">3,000</text></g><g><line x1="72" x2="720" y1="159.2" y2="159.2" style="stroke: var(--cds-chart-grid)"></line><text x="64" y="163.2" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-secondary)">4,000</text></g><g><line x1="72" x2="720" y1="114" y2="114" style="stroke: var(--cds-chart-grid)"></line><text x="64" y="118" text-anchor="end" font-size="11.5" style="fill: var(--cds-text-secondary)">5,000</text></g></g><g><line x1="72" x2="720" y1="340" y2="340" style="stroke: var(--cds-chart-axis)"></line><text x="72" y="358" text