          ramp: 5m
          duration: 30m
          maxInUse: 120
          arrivalBurst: 120
          spawnEvery: 100ms
          holdTime: 500ms
          holdJitter: 1s
        - name: spike-1
          at: 100m
          ramp: 0s
          duration: 3m
          maxInUse: 180
