      # 50m + [0,4m) jitter + 45s guard + 5m transaction < 60m.
      # Even a full 5-minute transaction at the latest allowed acquire is safe.
      maxConnLifetime: 50m
      maxConnLifetimeJitter: 4m
      maxConnIdleTime: 0s
      healthCheckPeriod: 1m
    workload:
      enabled: true
      maxInUse: 15
      holdTime: 5ms
      holdJitter: 5ms
      spawnEvery: 1s
      arrivalBurst: 10
      maxWait: 10s
      phases:
        - name: peak
          at: 40m
          ramp: 5m
          duration: 30m
          maxInUse: 100
          arrivalBurst: 100
          spawnEvery: 100ms
          holdTime: 250ms
          holdJitter: 500ms
        - name: spike-1
          at: 100m
          ramp: 0s
          duration: 3m
          maxInUse: 150
