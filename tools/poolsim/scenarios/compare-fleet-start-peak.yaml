# Adds a history peak to compare-fleet-start.yaml.
# Full demand at startup exposes the initial-fill barrier.
# Phase holds are stretched from real 5-50ms holds to reduce simulation events
# while preserving pool-driving concurrency. Queue waits scale with holds;
# compare phase wait percentiles between models, not as production latencies.
seed: 42
model: reservoir-sql
limiter: tokenBucket
duration: 3h
sampleEvery: 10s
steadyAfter: 90m
cluster:
  maxConnections: 10000
  handshake: {min: 50ms, max: 200ms}
limiterLatency: {min: 5ms, max: 10ms}
# A bucket permits bursts above 100/s; an oversubscribed target cannot converge.
# Disable these legacy assertions explicitly, retain counters for comparison.
assertMaxConnectsPerSec: -1
assertConvergeWithin: -1s
assertMaxClosurePerSec: -1
assertZeroEmptyEvents: false
assertZeroDSQLRejections: false
assertZeroDeadRequests: false
scenario: {kind: fleet_start, startWindow: 2s}
services:
  - name: history
    replicas: 4
    targetReady: 500
    maxOpen: 500
    inflightLimit: 8
    baseLifetime: 11m
    jitter: 2m
    guardWindow: 45s
    ephemeral: {pools: 2, connections: 3, duration: 1s}
    pgxpool:
      maxConns: 500
      minConns: 500
      # 50m + [0,4m) jitter + 45s guard + 5m transaction < 60m.
      # Even a full 5-minute transaction at the latest allowed acquire is safe.
      maxConnLifetime: 50m
      maxConnLifetimeJitter: 4m
      maxConnIdleTime: 0s
      healthCheckPeriod: 1m
    workload:
      enabled: true
      maxInUse: 30
      holdTime: 10ms
      holdJitter: 10ms
      spawnEvery: 1s
      arrivalBurst: 10
      maxWait: 10s
      phases:
        - name: peak
          at: 0s
          ramp: 0s
          duration: 30m
          maxInUse: 450
          arrivalBurst: 450
          spawnEvery: 100ms
          holdTime: 500ms
          holdJitter: 1s
