# 44 instances x 500 warm target = 22,000, versus a 10,000 cluster cap.
# Topology: ecs-400wps.yaml (which itself has NO enabled workload).
# Workload shape: workload-test.yaml, per replica, coarsened from 100ms ticks
# to 1s ticks with unchanged burst sizes and query hold times. This samples
# simultaneous demand (425 queries/s fleet-wide), not 400 literal workflows/s.
# No weighting/extrapolation is applied to request counts or tail percentiles.
# This keeps connection lifecycles exact while reducing workload events 10x.
# Comparison model settings are intentionally common to all three variants.
# MaxConns=MinConns=targetReady: compare equal warm targets, not a smaller pgx pool.
seed: 42
model: reservoir-sql
limiter: tokenBucket
duration: 3h
sampleEvery: 10s
steadyAfter: 90m
cluster:
  maxConnections: 10000
  handshake: {min: 50ms, max: 200ms}
limiterLatency: {min: 5ms, max: 10ms}
# A bucket permits bursts above 100/s; an oversubscribed target cannot converge.
# Disable these legacy assertions explicitly, retain counters for comparison.
assertMaxConnectsPerSec: -1
assertConvergeWithin: -1s
assertMaxClosurePerSec: -1
assertZeroEmptyEvents: false
assertZeroDSQLRejections: false
assertZeroDeadRequests: false
scenario: {kind: cold_start}
services:
  - name: history
    replicas: 16
    targetReady: 500
    maxOpen: 500
    inflightLimit: 8
    baseLifetime: 11m
    jitter: 2m
    guardWindow: 45s
    ephemeral: {pools: 2, connections: 3, duration: 1s}
    pgxpool:
      maxConns: 500
      minConns: 500
      # 50m + [0,4m) jitter + 45s guard + 5m transaction < 60m.
      # Even a full 5-minute transaction at the latest allowed acquire is safe.
      maxConnLifetime: 50m
      maxConnLifetimeJitter: 4m
      maxConnIdleTime: 0s
      healthCheckPeriod: 1m
    workload:
      enabled: true
      maxInUse: 30
      holdTime: 10ms
      holdJitter: 10ms
      spawnEvery: 1s
      arrivalBurst: 10
      maxWait: 10s
  - name: matching
    replicas: 16
    targetReady: 500
    maxOpen: 500
    inflightLimit: 8
    baseLifetime: 11m
    jitter: 2m
    guardWindow: 45s
    ephemeral: {pools: 2, connections: 3, duration: 1s}
    pgxpool:
      maxConns: 500
      minConns: 500
      # 50m + [0,4m) jitter + 45s guard + 5m transaction < 60m.
      # Even a full 5-minute transaction at the latest allowed acquire is safe.
      maxConnLifetime: 50m
      maxConnLifetimeJitter: 4m
      maxConnIdleTime: 0s
      healthCheckPeriod: 1m
    workload:
      enabled: true
      maxInUse: 20
      holdTime: 5ms
      holdJitter: 5ms
      spawnEvery: 1s
      arrivalBurst: 10
      maxWait: 10s
  - name: frontend
    replicas: 9
    targetReady: 500
    maxOpen: 500
    inflightLimit: 8
    baseLifetime: 11m
    jitter: 2m
    guardWindow: 45s
    ephemeral: {pools: 2, connections: 3, duration: 1s}
    pgxpool:
      maxConns: 500
      minConns: 500
      # 50m + [0,4m) jitter + 45s guard + 5m transaction < 60m.
      # Even a full 5-minute transaction at the latest allowed acquire is safe.
      maxConnLifetime: 50m
      maxConnLifetimeJitter: 4m
      maxConnIdleTime: 0s
      healthCheckPeriod: 1m
    workload:
      enabled: true
      maxInUse: 15
      holdTime: 5ms
      holdJitter: 5ms
      spawnEvery: 1s
      arrivalBurst: 10
      maxWait: 10s
  - name: worker
    replicas: 3
    targetReady: 500
    maxOpen: 500
    inflightLimit: 8
    baseLifetime: 11m
    jitter: 2m
    guardWindow: 45s
    ephemeral: {pools: 2, connections: 3, duration: 1s}
    pgxpool:
      maxConns: 500
      minConns: 500
      # 50m + [0,4m) jitter + 45s guard + 5m transaction < 60m.
      # Even a full 5-minute transaction at the latest allowed acquire is safe.
      maxConnLifetime: 50m
      maxConnLifetimeJitter: 4m
      maxConnIdleTime: 0s
      healthCheckPeriod: 1m
    workload:
      enabled: true
      maxInUse: 10
      holdTime: 20ms
      holdJitter: 10ms
      spawnEvery: 1s
      arrivalBurst: 5
      maxWait: 10s
